<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#dbf0f8">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>11/4 シー買い物ナビ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
/* スマホ片手用：画面下のタブで「リスト／場所／メニュー／買い方／注意」を切り替える。1画面1つの役割 */
/* 屋外の日差しでも読みやすいよう、端末のダークモードに関係なく常に明るい配色 */
:root {
  --bg: #f1f9fc;
  --card: #ffffff;
  --fg: #244d64;
  --muted: #526e80;
  --line: #d1e5ee;
  --harbor: #35799a;
  --harbor-soft: #e9f5fb;
  --scarf: #326c8d;
  --scarf-soft: #edf7fc;
  --done: #35799a;
  --done-soft: #edf7fc;
  --snow-scarf: #8bbbd3;
  --m-shop: #28644b;
  --m-app: #76509e;
  --m-food: #9b5517;
  --m-wagon: #a33b62;
  --font-display: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", sans-serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  --tabbar: 64px;
  color-scheme: light;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 16px; line-height: 1.65;
  -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap {
  max-width: 600px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
a { color: var(--harbor); }
:focus-visible { outline: 3px solid var(--harbor); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; line-height: 1.35; margin: 0; }
button { font: inherit; color: inherit; }

/* header: 常に上に固定。残りの数が一目でわかる */
header.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6;
  background: linear-gradient(180deg, #d4f0f6, var(--bg)); border-bottom: 1px solid var(--line);
}
header.top .wrap { padding-block: 10px; display: grid; gap: 6px; }
.head-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.title-block { min-width: 0; }
.eyebrow { font-size: 12px; color: var(--muted); }
h1 { font-size: 20px; }
.remain { text-align: right; flex: none; }
.remain b { font-family: var(--font-display); font-size: 28px; line-height: 1; color: var(--scarf); font-variant-numeric: tabular-nums; }
.remain small { display: block; font-size: 12px; color: var(--muted); }
.remain .unit { font-size: 14px; font-weight: 700; color: var(--scarf); margin-left: 2px; }
.remain.all-done .unit { display: none; }
.remain.all-done b { color: var(--done); }
.bar { height: 6px; border-radius: 999px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--done); transition: width .3s; }

/* 画面下のタブ */
nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 8;
  background: var(--card); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
  box-shadow: 0 -4px 16px rgba(15, 80, 100, .08);
}
nav.tabs .row { max-width: 600px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); }
nav.tabs button {
  border: 0; background: none; height: var(--tabbar); cursor: pointer;
  display: grid; place-items: center; align-content: center; gap: 2px;
  font-size: 12.5px; font-weight: 700; color: var(--muted);
}
nav.tabs svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
nav.tabs button[aria-selected="true"] { color: var(--harbor); }
nav.tabs button[aria-selected="true"] svg { stroke-width: 2.4; }

main { padding-block: 16px calc(var(--tabbar) + env(safe-area-inset-bottom, 0px) + 32px); }
.view { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
.view-intro { font-size: 14px; color: var(--muted); margin: 0; }
h2 { font-size: 19px; }

/* 買い方のバッジ */
.mtag { display: inline-block; font-size: 12px; font-weight: 700; color: #fff; border-radius: 6px; padding: 1px 8px; white-space: nowrap; }
.mtag.shop { background: var(--m-shop); }
.mtag.app { background: var(--m-app); }
.mtag.food { background: var(--m-food); }
.mtag.wagon { background: var(--m-wagon); }

/* 待ち列とアプリの案内：色だけでなく文字でも区別 */
.prep { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: grid; gap: 8px; }
.prep h2 { font-size: 17px; }
.prep p { margin: 0; font-size: 14px; }
.signals { display: flex; flex-wrap: wrap; gap: 6px; }
.signal { display: inline-block; border-radius: 7px; padding: 3px 8px; font-size: 12px; font-weight: 700; line-height: 1.5; }
.signal.queue { color: #824300; background: #fff1d6; }
.signal.required { color: #59389b; background: #eee7fb; }
.signal.optional { color: #096572; background: #def3f5; }
.signal.neutral { color: #4b5f6b; background: #edf2f5; }
.card-guidance { padding: 0 12px 12px; display: grid; gap: 6px; }
.card-guidance p, .place-guidance { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; }
.place-signals { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
.place-guidance { grid-column: 1 / -1; }
.need-filter { border: 0; padding: 0; margin: 0; min-width: 0; }
.need-filter legend { font-size: 13px; font-weight: 700; margin-bottom: 6px; }
.need-buttons { display: flex; flex-wrap: wrap; gap: 6px; }
.need-buttons button { min-height: 44px; padding: 7px 11px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); font-size: 13px; cursor: pointer; }
.need-buttons button[aria-pressed="true"] { border-color: var(--harbor); background: var(--harbor-soft); color: #075865; font-weight: 700; }
.group-head { flex-wrap: wrap; }

/* リスト */
.filter { display: flex; gap: 8px; }
.filter button {
  flex: 1; min-height: 40px; border-radius: 999px; border: 1px solid var(--line); background: var(--card);
  font-size: 14px; font-weight: 700; cursor: pointer;
}
.filter button[aria-pressed="true"] { background: var(--fg); border-color: var(--fg); color: #fff; }
.group { display: grid; gap: 10px; grid-template-columns: minmax(0, 1fr); }
.group-head { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
.group-head h2 { font-size: 17px; }
.group-head .how { font-size: 13px; color: var(--muted); }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.card-main { display: grid; grid-template-columns: 76px minmax(0, 1fr) 64px; gap: 12px; align-items: center; padding: 12px; }
.thumb { width: 76px; height: 76px; border-radius: 12px; object-fit: cover; background: var(--harbor-soft); }
.card h3 { font-size: 16px; }
.card .sub { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; margin-top: 4px; font-size: 13px; color: var(--muted); }
.qty { font-family: var(--font-display); font-weight: 700; font-size: 17px; color: var(--scarf); font-variant-numeric: tabular-nums; }
.split { display: inline-block; font-size: 12px; font-weight: 700; border-radius: 6px; padding: 0 7px; line-height: 1.7; }
.split.each { background: var(--scarf-soft); color: var(--scarf); }
.variant .split { justify-self: center; font-size: 11px; padding: 0 5px; }
.rule-box { background: var(--card); border: 2px solid var(--scarf); border-radius: 16px; padding: 12px 14px; display: grid; gap: 6px; }
.rule-box h2 { font-size: 16px; color: var(--scarf); }
.rule-box ul { margin: 0; padding-left: 1.2em; font-size: 14.5px; display: grid; gap: 3px; }
.tentative { font-size: 12px; color: var(--scarf); border: 1px solid var(--scarf); border-radius: 6px; padding: 0 6px; }
.tick {
  width: 64px; height: 64px; border-radius: 16px; border: 2px solid var(--line); background: var(--bg);
  display: grid; place-items: center; align-content: center; gap: 0; cursor: pointer; font-size: 11px; font-weight: 700; color: var(--muted);
}
.tick svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; opacity: .35; }
.tick[aria-pressed="true"] { background: var(--done); border-color: var(--done); color: #fff; }
.tick[aria-pressed="true"] svg { opacity: 1; }
.card.is-done { background: var(--done-soft); border-color: #bfe5cd; }
.card.is-done h3 { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--done); }
.card.is-done .thumb { opacity: .55; }

.variants { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 0 12px 12px; }
.variant { text-align: center; font-size: 13px; display: grid; gap: 2px; }
.variant img { width: 100%; aspect-ratio: 1; border-radius: 12px; object-fit: cover; }
.variant b { font-size: 15px; color: var(--scarf); font-variant-numeric: tabular-nums; }

details.more { border-top: 1px solid var(--line); }
details.more > summary {
  list-style: none; cursor: pointer; min-height: 48px; padding: 0 14px;
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  font-size: 14.5px; font-weight: 700; color: var(--harbor);
}
details.more > summary::-webkit-details-marker { display: none; }
details.more > summary::after { content: ""; width: 9px; height: 9px; border-right: 2.5px solid currentColor; border-bottom: 2.5px solid currentColor; transform: rotate(45deg) translateY(-3px); transition: transform .2s; flex: none; }
details.more[open] > summary::after { transform: rotate(-135deg) translateY(-3px); }
.more-body { padding: 0 14px 14px; display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); }
ul.points { margin: 0; padding-left: 1.2em; font-size: 15px; display: grid; gap: 4px; }
.small-link { font-size: 14px; }

/* 場所 */
.places { display: grid; gap: 8px; grid-template-columns: minmax(0, 1fr); }
.places-label { font-size: 13px; font-weight: 700; color: var(--muted); }
details.place { border: 1px solid var(--line); border-radius: 12px; background: var(--card); }
.more-body details.place { background: var(--bg); }
details.place > summary {
  list-style: none; cursor: pointer; padding: 10px 12px; min-height: 52px;
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; align-items: center;
}
details.place > summary::-webkit-details-marker { display: none; }
.pname { font-weight: 700; font-size: 15px; line-height: 1.4; }
.parea { font-size: 12.5px; color: var(--muted); }
.pextra { grid-column: 1; font-size: 13.5px; font-weight: 700; color: var(--m-food); }
.pin {
  grid-row: 1 / span 3; grid-column: 2; align-self: center;
  font-size: 13px; font-weight: 700; color: var(--harbor); background: var(--harbor-soft);
  border-radius: 999px; padding: 6px 12px; white-space: nowrap;
}
details.place[open] .pin { background: var(--harbor); color: #fff; }
details.place[open] .pin-label::after { content: "閉じる"; }
details.place:not([open]) .pin-label::after { content: "地図"; }
.place-body { padding: 0 12px 12px; display: grid; gap: 6px; grid-template-columns: minmax(0, 1fr); }
.place-body img { width: 100%; height: auto; aspect-ratio: 16 / 9; border-radius: 10px; object-fit: cover; background: var(--harbor-soft); display: block; }
.place-links { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13.5px; }

.area { display: grid; gap: 8px; grid-template-columns: minmax(0, 1fr); }
.area h2 { font-size: 17px; padding-bottom: 4px; border-bottom: 3px solid var(--harbor-soft); }
.chips { grid-column: 1; display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.chip { font-size: 12.5px; font-weight: 700; background: var(--harbor-soft); color: var(--fg); border-radius: 6px; padding: 1px 8px; }
.chip.got { background: var(--done-soft); color: var(--done); text-decoration: line-through; }

/* 買い方 */
.method { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: grid; gap: 10px; grid-template-columns: minmax(0, 1fr); }
.steps { margin: 0; padding-left: 1.4em; display: grid; gap: 6px; font-size: 15px; }
.callout { background: var(--scarf-soft); border-radius: 12px; padding: 10px 12px; font-size: 14.5px; }
.callout b { color: var(--scarf); }
.note { font-size: 13.5px; color: var(--muted); margin: 0; }
.method .for { font-size: 14px; }

.links { display: grid; gap: 8px; }
.links a { display: flex; align-items: center; min-height: 48px; padding: 0 14px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; font-weight: 700; font-size: 15px; text-decoration: none; }
footer { font-size: 12px; color: var(--muted); margin-top: 8px; }
@media (max-width: 360px) {
  .card-main { grid-template-columns: 60px minmax(0, 1fr) 52px; gap: 8px; padding: 10px; }
  .thumb { width: 60px; height: 60px; }
  .tick { width: 52px; height: 56px; }
}

@media (prefers-reduced-motion: reduce) { .bar i, details.more > summary::after { transition: none; } }

/* ふんわりスノー：採用された見本の水色と雪だるま。静止CSS/SVGで装飾。 */
body {
  background-color: var(--bg);
  background-image: radial-gradient(circle at 20px 24px, #b0d5e644 1px, transparent 1.5px);
  background-size: 42px 42px;
}
body::before { background: #dbf0f8; }
header.top { background: #dbf0f8; border-bottom: 1px solid #c5e2ef; box-shadow: 0 3px 14px #28597708; }
header.top::after {
  content: ""; position: absolute; bottom: -1px; left: 0; right: 0; height: 9px; pointer-events: none;
  background: radial-gradient(ellipse at 30% 100%, #f1f9fc 45%, transparent 48%) 0 0 / 60px 15px repeat-x;
}
header.top .wrap { position: relative; padding-block: 12px 16px; gap: 9px; }
header.top .eyebrow { color: #486e84; font-size: 11px; letter-spacing: .025em; }
.head-row, .bar { position: relative; z-index: 1; }
.title-line { display: flex; align-items: center; gap: 8px; margin-top: 3px; }
.title-line h1 { color: var(--fg); }
.snow-flakes { position: absolute; inset: 0; color: #76b3d0; opacity: .5; pointer-events: none; overflow: hidden; }
.snow-flakes svg { position: absolute; width: 15px; height: 15px; }
.snow-flakes svg:nth-child(1) { top: 8px; left: 56%; }
.snow-flakes svg:nth-child(2) { bottom: 26px; right: 25%; width: 11px; height: 11px; }
.snowflake { fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.snowman { position: relative; width: 62px; height: 88px; flex: none; }
.snowman-body { position: absolute; width: 53px; height: 45px; left: 5px; bottom: 3px; border: 1px solid #c1dce9; border-radius: 48% 48% 45% 45%; background: linear-gradient(120deg, #fff 40%, #e9f5fa); box-shadow: 0 3px 0 #77a8c11a; }
.snowman-body::before { content: ""; position: absolute; width: 3px; height: 3px; top: 18px; left: 25px; border-radius: 50%; background: #617b8a; box-shadow: 0 9px #617b8a; }
.snowman-head { position: absolute; top: 19px; left: 11px; width: 40px; height: 35px; border-radius: 48%; background: linear-gradient(120deg, #fff 50%, #eaf5fa); border: 1px solid #c1dce9; }
.snowman-head::before { content: ""; position: absolute; left: 10px; top: 13px; width: 3px; height: 3px; border-radius: 50%; background: #33516a; box-shadow: 14px 0 #33516a; }
.snowman-head::after { content: ""; position: absolute; left: 16px; top: 20px; width: 6px; height: 4px; border-bottom: 1.5px solid #56758b; border-radius: 50%; }
.snowman-nose { position: absolute; top: 35px; left: 30px; width: 8px; height: 4px; background: #e8ad83; border-radius: 50% 100% 100% 50%; transform: rotate(-12deg); }
.snowman-cheeks { position: absolute; top: 37px; left: 17px; width: 6px; height: 3px; border-radius: 50%; background: #ecc4c8; box-shadow: 21px 0 #ecc4c8; opacity: .8; }
.snowman-hat { position: absolute; width: 35px; height: 18px; left: 14px; top: 7px; background: var(--snow-scarf); border-radius: 18px 18px 3px 3px; transform: rotate(-8deg); }
.snowman-hat::before { content: ""; position: absolute; width: 41px; height: 7px; left: -3px; bottom: -2px; border-radius: 5px; background: #a9d0e3; }
.snowman-hat::after { content: ""; position: absolute; width: 11px; height: 10px; top: -7px; left: 13px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 1px #d4e8f1; }
.snowman-scarf { position: absolute; width: 42px; height: 9px; top: 49px; left: 10px; border-radius: 6px; background: var(--snow-scarf); }
.snowman-scarf::after { content: ""; position: absolute; width: 10px; height: 20px; top: 4px; left: 25px; border-radius: 0 0 3px 3px; background: repeating-linear-gradient(0deg, var(--snow-scarf) 0 5px, #c0dcea 5px 7px); transform: rotate(-8deg); }
.snowman-mini { width: 31px; height: 44px; flex: none; pointer-events: none; }
.snowman-mini > .snowman { transform: scale(.5); transform-origin: top left; }
.remain b, .remain.all-done b { color: #2e7598; }
.remain .unit { color: #326c8d; }
.remain small { color: #486e84; }
.bar { background: #c1dfea; height: 5px; }
.bar i { background: #3c80a0; }
.prep { position: relative; border-color: var(--line); background: #fff; box-shadow: 0 3px 12px #6a98b008; }
.prep h2 { color: var(--fg); padding-right: 30px; }
.note-flake { position: absolute; width: 22px; height: 22px; top: 12px; right: 12px; color: #87b9d0; pointer-events: none; }
.rule-box { border: 1px solid #d4e3ed; border-left: 3px solid #8cb5cc; background: #fff; }
.card, .method { box-shadow: 0 4px 10px #6a98b00b; }
.card { border-color: #cddfe9; border-radius: 18px; }
.card.is-done { border-color: #b9d8e8; }
.group-head h2, .area h2 { color: #3c6980; }
.group-head .mtag { box-shadow: 0 1px 0 #00000012; }
.area h2 { border-bottom-color: #c8e2ef; }
.area h2::before { content: ""; display: inline-block; width: 12px; height: 12px; margin-right: 8px; background: #87b9d0; clip-path: polygon(50% 0, 63% 37%, 100% 50%, 63% 63%, 50% 100%, 37% 63%, 0 50%, 37% 37%); }
.filter button[aria-pressed="true"] { background: var(--harbor); border-color: var(--harbor); }
.need-buttons button[aria-pressed="true"] { color: #326480; border-color: #83b3cd; background: #e9f5fb; }
nav.tabs { background: #fff; border-top-color: #c7e0ec; box-shadow: 0 -3px 14px #2859770b; }
nav.tabs button[aria-selected="true"] { color: #326c8d; background: #e9f5fb; box-shadow: inset 0 3px #83bbd7; }
footer { border-top: 1px solid var(--line); padding-top: 12px; }
.holiday-footer { display: flex; justify-content: center; align-items: center; gap: 12px; padding-top: 12px; color: #526e80; font-size: 11px; letter-spacing: .12em; }
.holiday-footer::before, .holiday-footer::after { content: ""; width: 30px; height: 1px; background: #bddae9; }
@media (max-width: 360px) {
  .title-line { gap: 6px; }
  .title-line h1 { font-size: 18px; }
  header.top .eyebrow { font-size: 10px; }
}

/* 共通レストランは購入予定のスーベニアから案内。 */
.common-panel { background: #fff; border: 1px solid #bddae9; border-radius: 16px; min-width: 0; }
.common-panel > summary { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px; min-height: 70px; list-style: none; cursor: pointer; color: #326480; }
.common-panel > summary::-webkit-details-marker { display: none; }
.common-title { display: block; text-wrap: balance; font-family: var(--font-display); font-size: 17px; font-weight: 700; line-height: 1.5; }
.common-panel > summary small { display: block; color: var(--muted); font-size: 12px; margin-top: 3px; }
.common-toggle { flex: none; display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; }
.common-toggle::before { content: "開く"; }
.common-toggle::after { content: ""; width: 8px; height: 8px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: rotate(45deg) translateY(-2px); }
.common-panel[open] > summary .common-toggle::before { content: "閉じる"; }
.common-panel[open] > summary .common-toggle::after { transform: rotate(-135deg) translateY(-2px); }
.common-panel[open] > summary { border-bottom: 1px solid var(--line); }
.common-body { padding: 12px; display: grid; gap: 10px; }
.common-body > p { margin: 0; }
.common-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.common-list li { min-width: 0; }
.common-list details.place { background: #f1f9fc; }
.common-list .chips .parea { flex-basis: 100%; }
.common-list .common-badge { display: none; }
.common-badge { grid-column: 1 / -1; justify-self: start; padding: 2px 8px; margin-top: 4px; border-radius: 6px; background: #deeff8; color: #326480; font-size: 12px; font-weight: 700; }
details.place { scroll-margin-top: calc(130px + env(safe-area-inset-top, 0px)); }

/* 見送りは購入済みと区別し、内容を残して取り消し線を付ける。 */
.card.is-skipped { background: #f3f6f8; border-style: dashed; }
.card.is-skipped h3, .card.is-skipped .qty { color: var(--muted); }
.card.is-skipped s { text-decoration-thickness: 1.5px; }
.card.is-skipped .thumb { opacity: .65; }
.skip-note { margin: 6px 0 0; font-size: 12px; font-weight: 700; color: #526e80; }
.skip-status { width: 64px; padding: 8px 3px; border: 1px solid #c7d5dd; border-radius: 10px; background: #e8eef2; color: #526e80; text-align: center; font-size: 12px; font-weight: 700; }
.chip.skipped { background: #e8eef2; color: #526e80; }
@media (max-width: 360px) { .skip-status { width: 52px; } }

/* 店頭と配送を選べる品は、詳細を開く前に購入経路を表示 */
.card-purchase { margin: 0 12px 12px; padding: 10px 12px; border: 1px solid #c8e2ef; border-radius: 10px; background: #edf7fc; }
.purchase-tag { display: inline-block; color: #326480; font-size: 13px; line-height: 1.6; }
.card-purchase p { margin: 4px 0 0; color: #41647a; font-size: 13px; line-height: 1.65; }
.also-purchase { padding: 10px 12px; border-radius: 10px; background: #edf7fc; border: 1px solid #c8e2ef; font-size: 14px; }
.also-purchase strong { color: #326480; }
.also-purchase p { margin: 4px 0 0; }

/* 飲食店メニュー：写真付きカードと、画像のない飲み物の一覧 */
.menu-controls { display: grid; gap: 11px; padding: 14px; border: 1px solid var(--line); border-radius: 16px; background: #fff; }
.menu-field { display: grid; gap: 5px; font-size: 13px; font-weight: 700; min-width: 0; }
.menu-field select, .menu-field input { width: 100%; min-width: 0; min-height: 46px; border: 1px solid #a9c8d9; border-radius: 9px; background: #f7fbfe; color: var(--fg); font: inherit; font-size: 16px; padding: 9px; }
.menu-check { display: flex; align-items: center; gap: 8px; font-size: 13px; min-height: 36px; }
.menu-check input { width: 18px; height: 18px; flex: none; accent-color: var(--harbor); }
.menu-store { display: grid; gap: 9px; }
.menu-store h3 { font-size: 18px; }
.menu-store .note, .menu-source { margin: 0; font-size: 12.5px; color: var(--muted); }
.menu-links { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.menu-button { min-height: 44px; padding: 8px 12px; border: 1px solid #83b3cd; border-radius: 9px; background: #fff; color: #326480; font-size: 13px; font-weight: 700; cursor: pointer; text-decoration: none; }
.menu-results { display: grid; gap: 20px; }
.menu-count { margin: 0; font-size: 13px; font-weight: 700; color: var(--muted); }
.menu-section { display: grid; gap: 10px; }
.menu-section h3 { font-size: 16px; padding-left: 9px; border-left: 3px solid #8bbbd3; text-wrap: pretty; }
.menu-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
.menu-card { min-width: 0; border: 1px solid var(--line); border-radius: 13px; background: #fff; overflow: hidden; }
.menu-photo { display: grid; place-items: center; aspect-ratio: 4 / 3; background: #fff; color: var(--muted); text-decoration: none; }
.menu-photo img { width: 100%; height: 100%; aspect-ratio: 4 / 3; object-fit: contain; }
.menu-photo span { font-size: 12px; padding: 12px; text-align: center; }
.menu-card-body { padding: 11px; display: grid; gap: 7px; }
.menu-card h4 { margin: 0; font-size: 14px; line-height: 1.55; overflow-wrap: anywhere; }
.menu-price { color: #326480; font-size: 14px; font-weight: 700; margin: 0; }
.menu-period, .menu-item-note { margin: 0; font-size: 11.5px; line-height: 1.6; color: var(--muted); }
.menu-date { display: inline-block; white-space: nowrap; }
.menu-period.outside { color: #9b5517; }
.menu-detail { font-size: 12px; min-height: 30px; display: inline-flex; align-items: center; justify-self: start; }
.menu-card.no-photo { grid-column: 1 / -1; }
.menu-card.no-photo .menu-card-body { grid-template-columns: minmax(0,1fr) auto; align-items: start; padding: 12px; }
.menu-card.no-photo .menu-price { text-align: right; max-width: 120px; }
.menu-card.no-photo .menu-item-note, .menu-card.no-photo .menu-period { grid-column: 1 / -1; }
.menu-empty { padding: 22px 14px; background: #fff; border: 1px dashed #a9c8d9; border-radius: 14px; font-size: 14px; }
@media (max-width: 360px) { .menu-grid { gap: 8px; } .menu-card-body { padding: 9px; } .menu-card h4 { font-size: 13px; } }
</style>

    return `${commonFoodHTML()}<p class="view-intro">いるエリアの近くで買えるものを探せます。お店をタップすると地図が出ます。ぬいぐるみバッジはアプリ注文なので、場所に関係なく入園後に注文（当日23:45まで・在庫次第）。店舗名の下で、アプリの要否と待ち列を確認できます。</p>
      ${AREAS.map(a => {
        const locs = Object.keys(LOC).filter(l => LOC[l].area === a && byLoc[l]);
        if (!locs.length) return "";
        return `<div class="area"><h2>${a}</h2>${locs.map(l => {
          const chips = byLoc[l].map(k => `<span class="chip${ITEMS[k].skipped ? " skipped" : ""}" data-chip="${k}">${itemLabel(k)}</span>`).join("");
          return placeHTML(l, null, chips, `where-${l}`);
        }).join("")}</div>`;
      }).join("")}`;
  },
  how() {
    return METHODS.map(m => `<section class="method">
        <div class="group-head">${mtag(m)}<h2>${m.title}</h2></div>
        ${m.id === "food" ? commonFoodHTML() : ""}
        <div class="for">${m.id === "app" ? "配送注文のみ（当面）" : "対象"}：${m.items.map(itemLabel).join("・")}</div>
        ${m.alsoItems ? `<div class="also-purchase"><strong>店頭＋配送注文</strong><p>${m.alsoItems.map(k => ITEMS[k].short).join("・")}</p><p class="note">どちらかの方法で予定数を購入。店頭で買えた分を配送でも重ねて注文しないようにしてください。</p></div>` : ""}
        <div class="card-guidance">${guidanceHTML(m.id === "food" ? { ...GUIDANCE.gummy, hint: "店によって注文方法が異なります。FSの3店はモバイルオーダーが必要。ほかは店頭注文も選べます。" } : GUIDANCE[m.id])}</div>
        <ol class="steps">${m.steps.map(x => `<li>${x}</li>`).join("")}</ol>
        <div class="callout">${m.callout}</div>
        ${m.note ? `<p class="note">${m.note}</p>` : ""}
      </section>`).join("");
  },
  rules() {
    return `<section class="method">
        <h2>列とアプリ表示の見方</h2>
        <ul class="points">
          <li>「列に注意」は、ショップやワゴンで待ち時間を見込むための目安。現在の混雑や待ち時間の実測ではありません</li>
          <li>スタンバイパスは指定時刻に並ぶためのもの。待ち時間ゼロ・商品の取り置きは保証しません</li>
          <li>モバイルオーダーは飲食の注文用。アプリショッピングは後日配送で、別のサービスです</li>
          <li>モバイルオーダーも受取待ちの可能性あり。席や在庫の保証ではなく、受付枠が終了する場合もあります</li>
          <li>FS＝ファンタジースプリングス。掲載する3店はモバイルオーダーが必要です</li>
        </ul>
        <p class="note">アプリ条件は2026年11月2日の公式案内を確認。11/4当日の変更・在庫・発券状況は公式アプリと現地で確かめてください。</p>
      </section>
      <section class="method">
        <h2>気をつけること</h2>
        <ul class="points">
          <li>販売場所・価格は11/2時点の案内。当日の在庫と販売方法はアプリと現地で確かめる</li>
          <li>ダッフィー冬商品は同じ物を1人1点まで。2個欲しい物は二人で1個ずつ（アプリも各自のアカウントで）</li>
          <li>ショップの会計は対象3店を通じて1日1回だけ。買った後の買い足しはできない</li>
          <li>飲食のスーベニアとバケットは、どれも1回の会計で1人1つまで</li>
          <li>アプリ通販も品切れになることがある。その日に身につけたい物は店頭で</li>
        </ul>
      </section>
      <div class="links">
        <a href="https://faq.tokyodisneyresort.jp/answer/6ac49dd19d7b5045c5704a36/" target="_blank" rel="noopener">販売・購入制限の公式案内</a>
        <a href="https://faq.tokyodisneyresort.jp/answer/67ec03700b94433b5f215cfd/" target="_blank" rel="noopener">同行者分のアプリ注文について（公式）</a>
        <a href="https://www.tokyodisneyresort.jp/tdr/guide/app_service/standbypass/" target="_blank" rel="noopener">スタンバイパスの公式案内</a>
        <a href="https://www.tokyodisneyresort.jp/tdr/guide/app_service/mobileorder.html" target="_blank" rel="noopener">モバイルオーダー対象店・使い方（公式）</a>
        <a href="https://faq.tokyodisneyresort.jp/answer/68387bc220cc1360ee17f10d/" target="_blank" rel="noopener">FSの3店で必要な注文方法（公式）</a>
        <a href="https://faq.tokyodisneyresort.jp/answer/67eaa65d7605a4cb7775c0d1/" target="_blank" rel="noopener">アプリを使わない店頭注文（公式）</a>
        <a href="https://www.tokyodisneyresort.jp/tds/restaurant.html" target="_blank" rel="noopener">飲食店の販売方法・更新情報（公式）</a>
        <a href="https://www.tokyodisneyresort.jp/tds/map.html" target="_blank" rel="noopener">シー全体のマップ（公式）</a>
        <a href="https://www.tokyodisneyresort.jp/tds/daily/calendar/20261104" target="_blank" rel="noopener">11/4の運営カレンダー（公式）</a>
      </div>
      <footer>販売場所・価格・画像は東京ディズニーリゾート公式サイト（2026年11月2日確認）より。<span class="holiday-footer" aria-hidden="true">WINTER SHOPPING</span></footer>`;
  },
};

let current = "list";
function show(view, scrollTop) {
  if (!VIEWS[view]) view = "list";
  current = view;
  const main = document.getElementById("main");
  main.innerHTML = `<div class="view">${VIEWS[view]()}</div>`;
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.view === view)));
  store.set("tds1104-view", view);
  sync();
  if (scrollTop) window.scrollTo(0, 0);
}

function sync() {
  const n = purchasedCount();
  Object.keys(ITEMS).forEach(k => {
    const on = isPlanned(k) && !!done[k];
    document.querySelectorAll(`.card[data-key="${k}"]`).forEach(el => {
      el.classList.toggle("is-done", on);
      el.hidden = !matchesList(k);
    });
    document.querySelectorAll(`.tick[data-key="${k}"]`).forEach(el => {
      el.setAttribute("aria-pressed", String(on));
      el.querySelector(".tick-label").textContent = on ? "済み" : "買えた";
    });
    document.querySelectorAll(`[data-chip="${k}"]`).forEach(el => el.classList.toggle("got", on));
  });
  document.querySelectorAll(".group").forEach(g => { g.hidden = ![...g.querySelectorAll(".card")].some(c => !c.hidden); });
  const allDone = document.getElementById("all-done-note");
  if (allDone) allDone.hidden = !(onlyLeft && n === TOTAL);
  const visibleCount = Object.keys(ITEMS).filter(matchesList).length;
  const result = document.getElementById("filter-result");
  if (result) result.textContent = `${visibleCount}種類を表示 / 全${Object.keys(ITEMS).length}種類（見送りは予定数に含みません）`;
  const noMatch = document.getElementById("no-match-note");
  if (noMatch) noMatch.hidden = visibleCount !== 0 || (onlyLeft && n === TOTAL);
  const left = TOTAL - n;
  document.getElementById("remain-n").textContent = left === 0 ? "完了" : String(left);
  document.getElementById("remain-head").textContent = left === 0 ? "ぜんぶ" : "あと";
  document.getElementById("remain-label").textContent = left === 0 ? `全${TOTAL}個 買えた` : `全${TOTAL}個中`;
  document.getElementById("remain").classList.toggle("all-done", left === 0);
  document.getElementById("bar").style.width = `${(n / TOTAL) * 100}%`;
}

document.addEventListener("click", e => {
  const menuLink = e.target.closest("[data-open-menu]");
  if (menuLink && MENU_DATA.restaurants[menuLink.dataset.openMenu]) {
    menuPlace = menuLink.dataset.openMenu; menuQuery = "";
    store.set("tds1104-menu-place", menuPlace); show("menu", true); return;
  }
  const menuMap = e.target.closest("[data-menu-map]");
  if (menuMap) {
    show("where", true);
    const place = document.getElementById(`where-${menuMap.dataset.menuMap}`);
    if (place) { place.open = true; place.querySelector("summary").focus({preventScroll:true}); place.scrollIntoView({block:"start"}); }
    return;
  }

  const tick = e.target.closest(".tick");
  if (tick) { const k = tick.dataset.key; if (!isPlanned(k)) return; done[k] = !done[k]; store.set("tds1104-done", done); sync(); return; }
  const f = e.target.closest("[data-filter]");
  if (f) {
    onlyLeft = f.dataset.filter === "left"; store.set("tds1104-onlyleft", onlyLeft);
    document.querySelectorAll("[data-filter]").forEach(b => b.setAttribute("aria-pressed", String(b === f)));
    sync(); return;
  }
  const need = e.target.closest("[data-need]");
  if (need) {
    needFilter = need.dataset.need;
    document.querySelectorAll("[data-need]").forEach(b => b.setAttribute("aria-pressed", String(b === need)));
    sync(); return;
  }
  const tab = e.target.closest("nav.tabs button");
  if (tab) show(tab.dataset.view, true);
});
document.addEventListener("change", e => {
  if (e.target.id === "menu-place" && MENU_DATA.restaurants[e.target.value]) {
    menuPlace = e.target.value; menuQuery = "";
    store.set("tds1104-menu-place", menuPlace); show("menu", false);
    document.getElementById("menu-place").focus({preventScroll:true});
  }
  if (e.target.id === "menu-period") { menuPeriodOnly = e.target.checked; updateMenuResults(); }
});
document.addEventListener("input", e => {
  if (e.target.id === "menu-search") { menuQuery = e.target.value; updateMenuResults(); }
});
document.addEventListener("error", e => {
  if (e.target.matches?.("img[data-menu-image]")) { e.target.hidden = true; e.target.nextElementSibling.hidden = false; }
}, true);
// 地図は開いたときだけ読み込む（園内の通信量を抑える）
document.addEventListener("toggle", e => {
  const d = e.target;
  if (d.matches && d.matches("details.place") && d.open) {
    const img = d.querySelector("img[data-src]");
    if (img) { img.src = img.dataset.src; img.removeAttribute("data-src"); }
  }
}, true);

const hash = (location.hash || "").slice(1);
show(VIEWS[hash] ? hash : (store.get("tds1104-view", "list") || "list"), false);
</script>
