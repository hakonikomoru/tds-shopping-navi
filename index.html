<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#d4f0f6">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>11/4 シー買い物ナビ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
/* スマホ片手用：画面下のタブで「リスト／場所／買い方／注意」を切り替える。1画面1つの役割 */
/* 屋外の日差しでも読みやすいよう、端末のダークモードに関係なく常に明るい配色 */
:root {
  --bg: #eef8fb;
  --card: #ffffff;
  --fg: #1d2c38;
  --muted: #5d6f7c;
  --line: #cfe4ec;
  --harbor: #0f8a9c;
  --harbor-soft: #d9f1f5;
  --scarf: #e04a4a;
  --scarf-soft: #fff0ee;
  --done: #2e9a5c;
  --done-soft: #e6f7ec;
  --m-shop: #0f8a9c;
  --m-app: #7a5bd1;
  --m-food: #d9771f;
  --m-wagon: #d24f8a;
  --font-display: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", sans-serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  --tabbar: 64px;
  color-scheme: light;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 16px; line-height: 1.65;
  -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap {
  max-width: 600px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
a { color: var(--harbor); }
:focus-visible { outline: 3px solid var(--harbor); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; line-height: 1.35; margin: 0; }
button { font: inherit; color: inherit; }

/* header: 常に上に固定。残りの数が一目でわかる */
header.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6;
  background: linear-gradient(180deg, #d4f0f6, var(--bg)); border-bottom: 1px solid var(--line);
}
header.top .wrap { padding-block: 10px; display: grid; gap: 6px; }
.head-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.title-block { min-width: 0; }
.eyebrow { font-size: 12px; color: var(--muted); }
h1 { font-size: 20px; }
.remain { text-align: right; flex: none; }
.remain b { font-family: var(--font-display); font-size: 28px; line-height: 1; color: var(--scarf); font-variant-numeric: tabular-nums; }
.remain small { display: block; font-size: 12px; color: var(--muted); }
.remain .unit { font-size: 14px; font-weight: 700; color: var(--scarf); margin-left: 2px; }
.remain.all-done .unit { display: none; }
.remain.all-done b { color: var(--done); }
.bar { height: 6px; border-radius: 999px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--done); transition: width .3s; }

/* 画面下のタブ */
nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 8;
  background: var(--card); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
  box-shadow: 0 -4px 16px rgba(15, 80, 100, .08);
}
nav.tabs .row { max-width: 600px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
nav.tabs button {
  border: 0; background: none; height: var(--tabbar); cursor: pointer;
  display: grid; place-items: center; align-content: center; gap: 2px;
  font-size: 12.5px; font-weight: 700; color: var(--muted);
}
nav.tabs svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
nav.tabs button[aria-selected="true"] { color: var(--harbor); }
nav.tabs button[aria-selected="true"] svg { stroke-width: 2.4; }

main { padding-block: 16px calc(var(--tabbar) + env(safe-area-inset-bottom, 0px) + 32px); }
.view { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
.view-intro { font-size: 14px; color: var(--muted); margin: 0; }
h2 { font-size: 19px; }

/* 買い方のバッジ */
.mtag { display: inline-block; font-size: 12px; font-weight: 700; color: #fff; border-radius: 6px; padding: 1px 8px; white-space: nowrap; }
.mtag.shop { background: var(--m-shop); }
.mtag.app { background: var(--m-app); }
.mtag.food { background: var(--m-food); }
.mtag.wagon { background: var(--m-wagon); }

/* リスト */
.filter { display: flex; gap: 8px; }
.filter button {
  flex: 1; min-height: 40px; border-radius: 999px; border: 1px solid var(--line); background: var(--card);
  font-size: 14px; font-weight: 700; cursor: pointer;
}
.filter button[aria-pressed="true"] { background: var(--fg); border-color: var(--fg); color: #fff; }
.group { display: grid; gap: 10px; grid-template-columns: minmax(0, 1fr); }
.group-head { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
.group-head h2 { font-size: 17px; }
.group-head .how { font-size: 13px; color: var(--muted); }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.card-main { display: grid; grid-template-columns: 76px minmax(0, 1fr) 64px; gap: 12px; align-items: center; padding: 12px; }
.thumb { width: 76px; height: 76px; border-radius: 12px; object-fit: cover; background: var(--harbor-soft); }
.card h3 { font-size: 16px; }
.card .sub { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; margin-top: 4px; font-size: 13px; color: var(--muted); }
.qty { font-family: var(--font-display); font-weight: 700; font-size: 17px; color: var(--scarf); font-variant-numeric: tabular-nums; }
.split { display: inline-block; font-size: 12px; font-weight: 700; border-radius: 6px; padding: 0 7px; line-height: 1.7; }
.split.each { background: var(--scarf-soft); color: var(--scarf); }
.split.decide { background: var(--harbor-soft); color: var(--harbor); }
.variant .split { justify-self: center; font-size: 11px; padding: 0 5px; }
.rule-box { background: var(--card); border: 2px solid var(--scarf); border-radius: 16px; padding: 12px 14px; display: grid; gap: 6px; }
.rule-box h2 { font-size: 16px; color: var(--scarf); }
.rule-box ul { margin: 0; padding-left: 1.2em; font-size: 14.5px; display: grid; gap: 3px; }
.tentative { font-size: 12px; color: var(--scarf); border: 1px solid var(--scarf); border-radius: 6px; padding: 0 6px; }
.tick {
  width: 64px; height: 64px; border-radius: 16px; border: 2px solid var(--line); background: var(--bg);
  display: grid; place-items: center; align-content: center; gap: 0; cursor: pointer; font-size: 11px; font-weight: 700; color: var(--muted);
}
.tick svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; opacity: .35; }
.tick[aria-pressed="true"] { background: var(--done); border-color: var(--done); color: #fff; }
.tick[aria-pressed="true"] svg { opacity: 1; }
.card.is-done { background: var(--done-soft); border-color: #bfe5cd; }
.card.is-done h3 { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--done); }
.card.is-done .thumb { opacity: .55; }

.variants { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 0 12px 12px; }
.variant { text-align: center; font-size: 13px; display: grid; gap: 2px; }
.variant img { width: 100%; aspect-ratio: 1; border-radius: 12px; object-fit: cover; }
.variant b { font-size: 15px; color: var(--scarf); font-variant-numeric: tabular-nums; }

details.more { border-top: 1px solid var(--line); }
details.more > summary {
  list-style: none; cursor: pointer; min-height: 48px; padding: 0 14px;
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  font-size: 14.5px; font-weight: 700; color: var(--harbor);
}
details.more > summary::-webkit-details-marker { display: none; }
details.more > summary::after { content: ""; width: 9px; height: 9px; border-right: 2.5px solid currentColor; border-bottom: 2.5px solid currentColor; transform: rotate(45deg) translateY(-3px); transition: transform .2s; flex: none; }
details.more[open] > summary::after { transform: rotate(-135deg) translateY(-3px); }
.more-body { padding: 0 14px 14px; display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); }
ul.points { margin: 0; padding-left: 1.2em; font-size: 15px; display: grid; gap: 4px; }
.small-link { font-size: 14px; }

/* 場所 */
.places { display: grid; gap: 8px; grid-template-columns: minmax(0, 1fr); }
.places-label { font-size: 13px; font-weight: 700; color: var(--muted); }
details.place { border: 1px solid var(--line); border-radius: 12px; background: var(--card); }
.more-body details.place { background: var(--bg); }
details.place > summary {
  list-style: none; cursor: pointer; padding: 10px 12px; min-height: 52px;
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; align-items: center;
}
details.place > summary::-webkit-details-marker { display: none; }
.pname { font-weight: 700; font-size: 15px; line-height: 1.4; }
.parea { font-size: 12.5px; color: var(--muted); }
.pextra { grid-column: 1; font-size: 13.5px; font-weight: 700; color: var(--m-food); }
.pin {
  grid-row: 1 / span 3; grid-column: 2; align-self: center;
  font-size: 13px; font-weight: 700; color: var(--harbor); background: var(--harbor-soft);
  border-radius: 999px; padding: 6px 12px; white-space: nowrap;
}
details.place[open] .pin { background: var(--harbor); color: #fff; }
details.place[open] .pin-label::after { content: "閉じる"; }
details.place:not([open]) .pin-label::after { content: "地図"; }
.place-body { padding: 0 12px 12px; display: grid; gap: 6px; grid-template-columns: minmax(0, 1fr); }
.place-body img { width: 100%; height: auto; aspect-ratio: 16 / 9; border-radius: 10px; object-fit: cover; background: var(--harbor-soft); display: block; }
.place-links { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13.5px; }

.area { display: grid; gap: 8px; grid-template-columns: minmax(0, 1fr); }
.area h2 { font-size: 17px; padding-bottom: 4px; border-bottom: 3px solid var(--harbor-soft); }
.chips { grid-column: 1; display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.chip { font-size: 12.5px; font-weight: 700; background: var(--harbor-soft); color: var(--fg); border-radius: 6px; padding: 1px 8px; }
.chip.got { background: var(--done-soft); color: var(--done); text-decoration: line-through; }

/* 買い方 */
.method { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: grid; gap: 10px; grid-template-columns: minmax(0, 1fr); }
.steps { margin: 0; padding-left: 1.4em; display: grid; gap: 6px; font-size: 15px; }
.callout { background: var(--scarf-soft); border-radius: 12px; padding: 10px 12px; font-size: 14.5px; }
.callout b { color: var(--scarf); }
.note { font-size: 13.5px; color: var(--muted); margin: 0; }
.method .for { font-size: 14px; }

.links { display: grid; gap: 8px; }
.links a { display: flex; align-items: center; min-height: 48px; padding: 0 14px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; font-weight: 700; font-size: 15px; text-decoration: none; }
footer { font-size: 12px; color: var(--muted); margin-top: 8px; }
@media (prefers-reduced-motion: reduce) { .bar i, details.more > summary::after { transition: none; } }
</style>
</head>

    <button role="tab" data-view="where" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>場所</button>

             points: ["スタンバイパス対象外。現地の列・案内に従う", "1回の会計で1人1つまで"],
             places: [["pcDock", "キャラメル"], ["pcSoaring", "ブラックペッパー"], ["pcLido", "ガーリックシュリンプ"], ["pcTink", "ガーリックシュリンプ"], ["pcLiberty", "麻辣"], ["pcHorizon", "トリュフソルト"]] },

const METHODS = [
  { id: "shop", label: "ショップ", title: "ショップで買う", how: "スタンバイパスで入店", items: ["charm", "figure", "mug", "cap"],
    steps: ["シーに入園したら、公式アプリで対象ショップのスタンバイパスを取る", "指定時間にショップへ入って、欲しい対象商品をすべて選んでから会計", "買う人それぞれが、当日入園したチケットを見せられるようにしておく（チケット認証あり）"],
    callout: "<b>同じ商品は1人1点まで。</b>違う商品ならそれぞれ1点ずつ選べる。2個欲しい物（ダッフィーとリーナ・ベルのチャーム、フィギュア、ファンキャップ）は二人が1個ずつ買う。<br><b>会計は対象3店を通じて1日1回だけ。</b>買った後に別の店や同じ店で買い足すことはできない。",
    note: "対象店（11/2から当面）：マクダックス・デパートメントストア、アーント・ペグズ・ヴィレッジストア、ガッレリーア・ディズニー。どの店に何があるかはアプリで確かめる。スタンバイパスは商品の取り置きではない。シェリーメイのチャームとマグは、どちらが買うか先に決めておく。" },
  { id: "app", label: "アプリ", title: "公式アプリで注文", how: "入園後に注文・後日配送", items: ["badge"],
    steps: ["当日のチケットでシーに入園する", "東京ディズニーリゾート・アプリの「ショッピング」を開く", "在庫と販売条件を確かめて、当日23:45までに注文を終える", "後日、家に届く"],
    callout: "<b>同じ商品は1人1点まで。</b>2個欲しいときは、二人が各自のアカウントで1個ずつ注文する。チケットを共有していても、1人の注文に2人分はまとめられない。<br><b>入園前は注文できない。</b>23:45は注文できる時間の上限で、在庫の保証ではない。",
    note: "チャーム・ガラスマグ・ファンキャップもアプリで注文できる（予定数はショップと共通）。フィギュアはアプリだとBOXのみ。スタンバイパスはいらない。" },
  { id: "food", label: "飲食店", title: "飲食店で注文", how: "メニューと一緒に注文", items: ["cup", "tumbler", "gummy"],
    steps: ["対象のお店で、対象メニューにスーベニアを付けて注文する", "グミのケースは「グミキャンディー、ミニスナックケース付き」を注文する"],
    callout: "<b>スーベニア単品では買えない。</b>どれも1回の会計で1人1つまで。" },
  { id: "wagon", label: "ワゴン", title: "ポップコーンワゴン", how: "列に並んで購入", items: ["bucket"],
    steps: ["対象のワゴンのどれかに並ぶ", "「バケット付き」を買う（味はワゴンごとに決まっている）"],
    callout: "<b>スタンバイパス対象外。</b>現地の列と案内に従う。グミのミニスナックケースとは別の商品。" },
];
const METHOD_OF = {};
METHODS.forEach(m => m.items.forEach(k => { METHOD_OF[k] = m; }));
const TOTAL = Object.values(ITEMS).reduce((a, it) => a + it.qty, 0);

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};
let done = store.get("tds1104-done", {}) || {};
let onlyLeft = !!store.get("tds1104-onlyleft", false);

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const mtag = m => `<span class="mtag ${m.id}">${m.label}</span>`;
const splitHTML = sp => sp === "each" ? '<span class="split each">二人で1個ずつ</span>' : sp === "decide" ? '<span class="split decide">どちらが買うか決める</span>' : "";
const CHECK_SVG ='<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

function placeHTML(key, extra, chips) {
  const p = LOC[key];
  return `<details class="place">
    <summary>
      <span class="pname">${esc(p.name)}</span>
      <span class="pin"><span class="pin-label"></span></span>
      ${chips ? `<span class="chips">${chips}</span>` : `<span class="parea">${esc(p.area)}</span>`}
      ${extra ? `<span class="pextra">${esc(extra)}</span>` : ""}
    </summary>
    <div class="place-body">
      <a href="img/${p.img}" target="_blank" rel="noopener"><img data-src="img/${p.img}" alt="${esc(p.name)}の場所（公式マップ）" width="800" height="450"></a>
      <div class="place-links"><span class="note">地図をタップで拡大</span><a href="${OFFICIAL}${p.url}" target="_blank" rel="noopener">公式の店舗ページ</a></div>
    </div></details>`;
}

function cardHTML(key) {
  const it = ITEMS[key], m = METHOD_OF[key];
  const variants = it.variants ? `<div class="variants">${it.variants.map(([img, n, q, sp]) =>
    `<div class="variant"><img src="img/${img}" alt="${esc(n)}のチャーム" loading="lazy"><span>${esc(n)}</span><b>${q}個</b>${splitHTML(sp)}</div>`).join("")}</div>` : "";
  const places = it.places ? `<div class="places"><div class="places-label">${m.id === "shop" ? "対象ショップ（どれか1店）" : `買える場所 ${it.places.length}か所`}・タップで地図</div>${it.places.map(([k, x]) => placeHTML(k, x)).join("")}</div>` : "";
  const moreLabel = it.places ? (m.id === "shop" ? "買い方と対象ショップ" : `買い方と場所（${it.places.length}か所）`) : "買い方";
  return `<article class="card" data-key="${key}" id="item-${key}">
    <div class="card-main">
      <img class="thumb" src="img/${it.img}" alt="${esc(it.name)}" loading="lazy">
      <div>
        <h3>${esc(it.name)}</h3>
        <div class="sub"><span class="qty">${it.qty}個</span>${it.tentative ? '<span class="tentative">仮</span>' : ""}<span>${esc(it.price)}</span></div>
        ${it.split ? `<div class="sub">${splitHTML(it.split)}</div>` : ""}
      </div>
      <button class="tick" data-key="${key}" aria-pressed="false" aria-label="${esc(it.short)}を買えた">${CHECK_SVG}<span class="tick-label">買えた</span></button>
    </div>
    ${variants}
    <details class="more">
      <summary>${moreLabel}</summary>
      <div class="more-body">
        ${it.order ? `<div class="callout"><b>注文：</b>${esc(it.order)}</div>` : ""}
        <ul class="points">${it.points.map(p => `<li>${esc(p)}</li>`).join("")}</ul>
        ${places}
        <a class="small-link" href="${OFFICIAL}${it.url}" target="_blank" rel="noopener">公式の商品ページ</a>
      </div>
    </details>
  </article>`;
}

const VIEWS = {
  list() {
    return `<div class="rule-box">
        <h2>先に確認：買える数のルール</h2>
        <ul>
          <li>同じ商品は<b>1人1個まで</b>。2個の物は二人で1個ずつ買う</li>
          <li>ショップの会計は対象3店を通じて<b>1日1回だけ</b>。全部選んでから会計する</li>
          <li>買う人それぞれが当日のチケットを見せられるように</li>
        </ul>
      </div>
      <div class="filter">
        <button data-filter="all" aria-pressed="${!onlyLeft}">ぜんぶ</button>
        <button data-filter="left" aria-pressed="${onlyLeft}">まだ買ってないもの</button>
      </div>
      ${METHODS.map(m => `<div class="group" data-method="${m.id}">
        <div class="group-head">${mtag(m)}<h2>${m.title}</h2><span class="how">${m.how}</span></div>
        ${m.items.map(cardHTML).join("")}
      </div>`).join("")}
      <p class="note" id="all-done-note" hidden>ぜんぶ買えました。</p>
      <p class="note">「買えた」はこの端末だけに保存されます。バッジ2個は仮の数です。</p>`;
  },
  where() {
    const byLoc = {};
    Object.keys(ITEMS).forEach(k => (ITEMS[k].places || []).forEach(([l]) => { (byLoc[l] = byLoc[l] || []).push(k); }));
    return `<p class="view-intro">いるエリアの近くで買えるものを探せます。お店をタップすると地図が出ます。ぬいぐるみバッジはアプリ注文なので、場所に関係なく入園後いつでも。</p>
      ${AREAS.map(a => {
        const locs = Object.keys(LOC).filter(l => LOC[l].area === a && byLoc[l]);
        if (!locs.length) return "";
        return `<div class="area"><h2>${a}</h2>${locs.map(l => {
          const chips = byLoc[l].map(k => `<span class="chip" data-chip="${k}">${ITEMS[k].short}</span>`).join("");
          return placeHTML(l, null, chips);
        }).join("")}</div>`;
      }).join("")}`;
  },
  how() {
    return METHODS.map(m => `<section class="method">
        <div class="group-head">${mtag(m)}<h2>${m.title}</h2></div>
        <div class="for">対象：${m.items.map(k => ITEMS[k].short).join("・")}</div>
        <ol class="steps">${m.steps.map(x => `<li>${x}</li>`).join("")}</ol>
        <div class="callout">${m.callout}</div>
        ${m.note ? `<p class="note">${m.note}</p>` : ""}
      </section>`).join("");
  },
  rules() {
    return `<section class="method">
        <h2>気をつけること</h2>
        <ul class="points">
          <li>販売場所・価格は11/2時点の案内。当日の在庫と販売方法はアプリと現地で確かめる</li>
          <li>ダッフィー冬商品は同じ物を1人1点まで。2個欲しい物は二人で1個ずつ（アプリも各自のアカウントで）</li>
          <li>ショップの会計は対象3店を通じて1日1回だけ。買った後の買い足しはできない</li>
          <li>飲食のスーベニアとバケットは、どれも1回の会計で1人1つまで</li>
          <li>アプリ通販も品切れになることがある。その日に身につけたい物は店頭で</li>
        </ul>
      </section>
      <div class="links">
        <a href="https://faq.tokyodisneyresort.jp/answer/6ac49dd19d7b5045c5704a36/" target="_blank" rel="noopener">販売・購入制限の公式案内</a>
        <a href="https://faq.tokyodisneyresort.jp/answer/67ec03700b94433b5f215cfd/" target="_blank" rel="noopener">同行者分のアプリ注文について（公式）</a>
        <a href="https://www.tokyodisneyresort.jp/tdr/guide/app_service/standbypass/" target="_blank" rel="noopener">スタンバイパスの公式案内</a>
        <a href="https://www.tokyodisneyresort.jp/tds/map.html" target="_blank" rel="noopener">シー全体のマップ（公式）</a>
        <a href="https://www.tokyodisneyresort.jp/tds/daily/calendar/20261104" target="_blank" rel="noopener">11/4の運営カレンダー（公式）</a>
      </div>
      <footer>販売場所・価格・画像は東京ディズニーリゾート公式サイト（2026年11月2日確認）より。</footer>`;
  },
};

let current = "list";
function show(view, scrollTop) {
  if (!VIEWS[view]) view = "list";
  current = view;
  const main = document.getElementById("main");
  main.innerHTML = `<div class="view">${VIEWS[view]()}</div>`;
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.view === view)));
  store.set("tds1104-view", view);
  sync();
  if (scrollTop) window.scrollTo(0, 0);
}

function sync() {
  let n = 0;
  Object.keys(ITEMS).forEach(k => {
    const on = !!done[k];
    if (on) n += ITEMS[k].qty;
    document.querySelectorAll(`.card[data-key="${k}"]`).forEach(el => {
      el.classList.toggle("is-done", on);
      el.hidden = onlyLeft && on;
    });
    document.querySelectorAll(`.tick[data-key="${k}"]`).forEach(el => {
      el.setAttribute("aria-pressed", String(on));
      el.querySelector(".tick-label").textContent = on ? "済み" : "買えた";
    });
    document.querySelectorAll(`[data-chip="${k}"]`).forEach(el => el.classList.toggle("got", on));
  });
  document.querySelectorAll(".group").forEach(g => { g.hidden = onlyLeft && ![...g.querySelectorAll(".card")].some(c => !c.hidden); });
  const allDone = document.getElementById("all-done-note");
  if (allDone) allDone.hidden = !(onlyLeft && n === TOTAL);
  const left = TOTAL - n;
  document.getElementById("remain-n").textContent = left === 0 ? "完了" : String(left);
  document.getElementById("remain-head").textContent = left === 0 ? "ぜんぶ" : "あと";
  document.getElementById("remain-label").textContent = left === 0 ? `全${TOTAL}個 買えた` : `全${TOTAL}個中`;
  document.getElementById("remain").classList.toggle("all-done", left === 0);
  document.getElementById("bar").style.width = `${(n / TOTAL) * 100}%`;
}

document.addEventListener("click", e => {
  const tick = e.target.closest(".tick");
  if (tick) { const k = tick.dataset.key; done[k] = !done[k]; store.set("tds1104-done", done); sync(); return; }
  const f = e.target.closest("[data-filter]");
  if (f) {
    onlyLeft = f.dataset.filter === "left"; store.set("tds1104-onlyleft", onlyLeft);
    document.querySelectorAll("[data-filter]").forEach(b => b.setAttribute("aria-pressed", String(b === f)));
    sync(); return;
  }
  const tab = e.target.closest("nav.tabs button");
  if (tab) show(tab.dataset.view, true);
});
// 地図は開いたときだけ読み込む（園内の通信量を抑える）
document.addEventListener("toggle", e => {
  const d = e.target;
  if (d.matches && d.matches("details.place") && d.open) {
    const img = d.querySelector("img[data-src]");
    if (img) { img.src = img.dataset.src; img.removeAttribute("data-src"); }
  }
}, true);

const hash = (location.hash || "").slice(1);
show(VIEWS[hash] ? hash : (store.get("tds1104-view", "list") || "list"), false);
</script>
</body>
</html>
